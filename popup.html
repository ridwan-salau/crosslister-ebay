<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay → Depop Crosslister</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fff;
    }
    .header {
      background: linear-gradient(135deg, #ff0050, #ff4d6d);
      color: #fff;
      padding: 16px 20px;
      text-align: center;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }

    .content { padding: 16px 20px; }
    .section { margin-bottom: 16px; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 4px;
    }
    .field input[type="text"],
    .field input[type="number"],
    .field input[type="password"],
    .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: #ff0050;
      box-shadow: 0 0 0 2px rgba(255,0,80,0.15);
    }
    .field .hint {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .toggle-row label { font-size: 13px; color: #333; cursor: pointer; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc; border-radius: 22px;
      transition: background 0.2s;
    }
    .slider::before {
      content: ""; position: absolute;
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #ff0050; }
    input:checked + .slider::before { transform: translateX(18px); }

    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
      flex: 1; padding: 10px;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #ff0050; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #333; }

    .status {
      margin-top: 12px; padding: 8px; border-radius: 6px;
      font-size: 12px; text-align: center; display: none;
    }
    .status.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .status.error { background: #ffebee; color: #c62828; display: block; }

    .history { max-height: 200px; overflow-y: auto; }
    .history-item {
      padding: 8px; border-bottom: 1px solid #f0f0f0;
      font-size: 12px;
    }
    .history-item .title { font-weight: 500; color: #333; }
    .history-item .meta { color: #999; margin-top: 2px; }
    .history-empty { color: #bbb; font-size: 12px; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>eBay → Depop</h1>
    <p>Cross-lister Extension</p>
  </div>

  <div class="content">
    <!-- Settings -->
    <div class="section">
      <div class="section-title">Settings</div>

      <div class="field">
        <label for="geminiKey">Gemini API Key</label>
        <input type="password" id="geminiKey" placeholder="AIza...">
        <div class="hint">Used to transform descriptions into Depop-style. <a href="https://aistudio.google.com/apikey" target="_blank">Get a key</a></div>
      </div>

      <div class="field">
        <label for="priceBuffer">Price Buffer (%)</label>
        <input type="number" id="priceBuffer" placeholder="10" min="0" max="100" step="1">
        <div class="hint">Add % markup on Depop to cover fees. Default: 10%</div>
      </div>

      <div class="field">
        <label for="shippingPreference">Shipping</label>
        <select id="shippingPreference">
          <option value="">Don't set (manual)</option>
          <option value="small">Small (up to 1kg)</option>
          <option value="medium">Medium (1-2kg)</option>
          <option value="large">Large (2-5kg)</option>
          <option value="xl">Extra Large (5-10kg)</option>
          <option value="free">Free Shipping</option>
          <option value="manual">Arrange My Own</option>
        </select>
      </div>

      <div class="toggle-row">
        <label for="aiEnabled">AI Description Rewrite</label>
        <label class="switch">
          <input type="checkbox" id="aiEnabled">
          <span class="slider"></span>
        </label>
      </div>

    </div>

    <!-- Signup -->
    <div class="section">
      <div class="section-title">Stay updated</div>
      <div class="field">
        <input type="text" id="signupName" placeholder="Full name">
      </div>
      <div class="field">
        <input type="email" id="signupEmail" placeholder="Email address">
      </div>
      <button class="btn btn-primary" id="signupBtn" style="width:100%;">Get notified of updates</button>
      <div class="status" id="signupStatus"></div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="saveBtn">Save Settings</button>
      <button class="btn btn-secondary" id="clearBtn">Clear Staged</button>
    </div>
    <div class="status" id="status"></div>

    <!-- Recent listings -->
    <div class="section" style="margin-top: 16px;">
      <div class="section-title">Recent Cross-lists</div>
      <div class="history" id="history">
        <div class="history-empty">No listings yet.</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
